services:
    hugo:
        image: hugomods/hugo:exts-non-root
        command: server --baseURL https://blog.ewlf.de --port 443 --gc --minify
        user: 0:0
        ports:
            - 1313:1313
        volumes:
            - ./:/src
            - ~/hugo_cache:/tmp/hugo_cache
        restart: unless-stopped
